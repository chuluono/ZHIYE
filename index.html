  <script src="js/posts.js"></script>

  <script>
    function __initHome() {
      var H = window.BLOG_HELPERS;
      /* 首页列表视图：系列只显示一章入口，其余章节经文章页章节目录访问 */
      var posts = H.visiblePosts();
      var tags = H.allTags(posts);

      /* 公众号二维码弹层：点击切换（悬停由 CSS 兜底），点击外部关闭；二维码图片缺失时显示占位 */
      var wxWrap = document.querySelector(".profile-wechat");
      var wxBtn = document.getElementById("wxBtn");
      var wxImg = document.querySelector(".wx-pop img");
      if (wxImg) {
        wxImg.addEventListener("error", function () { wxImg.closest(".wx-pop").classList.add("no-qr"); });
      }
      if (wxBtn && wxWrap) {
        wxBtn.addEventListener("click", function (e) {
          e.stopPropagation();
          var open = wxWrap.classList.toggle("open");
          wxBtn.setAttribute("aria-expanded", open ? "true" : "false");
        });
        document.addEventListener("click", function (e) {
          if (!wxWrap.contains(e.target)) {
            wxWrap.classList.remove("open");
            wxBtn.setAttribute("aria-expanded", "false");
          }
        });
      }

      /* 作者卡片统计 */
      var totalMin = posts.reduce(function (s, p) { return s + H.readingMin(p.content); }, 0);
      document.getElementById("profileStats").innerHTML =
        '<div class="pstat"><b>' + posts.length + "</b><span>文章</span></div>" +
        '<div class="pstat"><b>' + tags.length + "</b><span>标签</span></div>" +
        '<div class="pstat"><b>' + totalMin + "</b><span>分钟阅读</span></div>";

      /* 侧栏：最近文章 */
      document.getElementById("recentList").innerHTML = posts.slice(0, 5).map(function (p) {
        var thumb = '<span class="mini-thumb" style="' + H.coverStyle(p) + '" aria-hidden="true">' +
          (p.coverImg ? '<img src="' + window.BLOG_ROOT + p.coverImg + '" alt="" loading="lazy">' : p.emoji) +
          "</span>";
        return '<li><a href="' + H.postURL(p) + '">' + thumb +
          '<span class="mini-text"><span class="mini-title">' + H.escapeHtml(p.title) + "</span>" +
          "<time>" + H.fmtRelative(p.date) + "</time></span></a></li>";
      }).join("");

      /* 状态：标签 + 关键词可叠加过滤 */
      var currentTag = new URLSearchParams(location.search).get("tag") || "全部";
      var query = "";
      var PAGE_SIZE = 4;   /* 每页文章数 */
      var pageNum = 1;
      var filterBox = document.getElementById("tagFilter");
      var listEl = document.getElementById("postList");
      var searchInput = document.getElementById("searchInput");
      var searchBox = document.querySelector(".search-box");
      var searchClear = document.getElementById("searchClear");
      var featuredSection = document.getElementById("featuredSection");

      /* 精选（最新一篇）；无文章时隐藏该区块 */
      document.getElementById("featured").innerHTML = posts.length ? H.cardHTML(posts[0], true) : "";
      if (!posts.length) featuredSection.style.display = "none";

      function renderChips() {
        var html = ['<button class="chip' + (currentTag === "全部" ? " active" : "") + '" data-tag="全部">全部 <i>' + posts.length + "</i></button>"];
        tags.forEach(function (t) {
          html.push('<button class="chip' + (currentTag === t[0] ? " active" : "") + '" data-tag="' + H.escapeHtml(t[0]) + '">' + H.escapeHtml(t[0]) + " <i>" + t[1] + "</i></button>");
        });
        filterBox.innerHTML = html.join("");
      }

      function matchQuery(p, q) {
        var hay = (p.title + " " + p.excerpt + " " + p.tags.join(" ")).toLowerCase();
        return hay.indexOf(q.toLowerCase()) !== -1;
      }

      function renderList() {
        var list = posts.filter(function (p) {
          return (currentTag === "全部" || p.tags.indexOf(currentTag) !== -1) && (!query || matchQuery(p, query));
        });
        document.getElementById("listTitle").innerHTML = query
          ? "搜索：<span class=\"grad\">" + H.escapeHtml(query) + "</span>"
          : (currentTag === "全部" ? "全部文章" : "标签：" + H.escapeHtml(currentTag));
        document.getElementById("listCount").textContent = list.length + " 篇";
        featuredSection.style.display = (posts.length && currentTag === "全部" && !query) ? "" : "none";

        var pgBox = document.getElementById("pagination");
        if (!list.length) {
          pgBox.hidden = true;
          listEl.innerHTML = query
            ? '<div class="empty-state"><div class="big">🔭</div>没有找到与「' + H.escapeHtml(query) + '」相关的文章<br>换个关键词试试？</div>'
            : '<div class="empty-state"><div class="big">🌱</div>这个标签下还没有文章～</div>';
          return;
        }

        /* 分页切片 */
        var totalPages = Math.ceil(list.length / PAGE_SIZE);
        if (pageNum > totalPages) pageNum = totalPages;
        if (pageNum < 1) pageNum = 1;
        var pageList = list.slice((pageNum - 1) * PAGE_SIZE, pageNum * PAGE_SIZE);

        /* 卡片带 stagger 渐显延迟，标题与摘要做搜索高亮 */
        listEl.innerHTML = pageList.map(function (p, i) {
          var delay = " style=\"transition-delay:" + Math.min(i, 8) * 55 + "ms\"";
          return H.cardHTML(p, false, query).replace('class="post-card"', 'class="post-card reveal"' + delay);
        }).join("");
        window.BLOG_initReveal(listEl);

        /* 分页条（← 1 →） */
        if (totalPages <= 1) { pgBox.hidden = true; pgBox.innerHTML = ""; return; }
        pgBox.hidden = false;
        var phtml = '<button class="pg-btn pg-nav" data-pg="prev" aria-label="上一页"' + (pageNum === 1 ? " disabled" : "") + ">←</button>";
        for (var i = 1; i <= totalPages; i++) {
          phtml += '<button class="pg-btn' + (i === pageNum ? " active" : "") + '" data-pg="' + i + '" aria-label="第 ' + i + ' 页">' + i + "</button>";
        }
        phtml += '<button class="pg-btn pg-nav" data-pg="next" aria-label="下一页"' + (pageNum === totalPages ? " disabled" : "") + ">→</button>";
        pgBox.innerHTML = phtml;
      }

      /* 标签筛选 */
      filterBox.addEventListener("click", function (e) {
        var btn = e.target.closest(".chip");
        if (!btn) return;
        currentTag = btn.getAttribute("data-tag");
        pageNum = 1;
        renderChips();
        renderList();
        /* file:// 协议下 replaceState 可能抛 SecurityError，静默降级 */
        try {
          history.replaceState(null, "", currentTag === "全部" ? "index.html" : "index.html?tag=" + encodeURIComponent(currentTag));
        } catch (err) {}
      });

      /* 分页翻页 */
      document.getElementById("pagination").addEventListener("click", function (e) {
        var btn = e.target.closest(".pg-btn");
        if (!btn || btn.disabled) return;
        var v = btn.getAttribute("data-pg");
        if (v === "prev") pageNum -= 1;
        else if (v === "next") pageNum += 1;
        else pageNum = parseInt(v, 10);
        renderList();
        H.smoothTo(document.getElementById("listTitle"));
      });

      /* 实时搜索（轻防抖） */
      var debounceTimer = null;
      searchInput.addEventListener("input", function () {
        searchBox.classList.toggle("has-value", !!searchInput.value);
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(function () {
          query = searchInput.value.trim();
          pageNum = 1;
          renderList();
        }, 140);
      });
      searchClear.addEventListener("click", function () {
        searchInput.value = "";
        searchBox.classList.remove("has-value");
        query = "";
        pageNum = 1;
        renderList();
        searchInput.focus();
      });

      renderChips();
      renderList();
    }
    __initHome();
  </script>
