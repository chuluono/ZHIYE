  <script>
    function __initNotesPage() {
      var H = window.BLOG_HELPERS;
      var notes = (window.BLOG_NOTES || []).slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; });

      document.getElementById("notesStats").innerHTML =
        '<div class="stat"><b>' + notes.length + "</b><span>条随笔</span></div>" +
        '<div class="stat"><b>' + (notes.length ? notes[notes.length - 1].date.slice(0, 7) : "—") + "</b><span>最早记录</span></div>";

      var box = document.getElementById("notesList");
      if (!notes.length) {
        box.innerHTML = '<div class="empty-state"><div class="big">🍃</div>还没有写下任何随笔～</div>';
        return;
      }

      /* 按年分组渲染 */
      var html = "";
      var lastYear = "";
      notes.forEach(function (n, i) {
        var year = n.date.slice(0, 4);
        if (year !== lastYear) {
          if (lastYear !== "") html += "</div>";
          html += '<div class="note-year">' + year + "</div>";
          html += '<div class="note-group">';
          lastYear = year;
        }
        html +=
          '<div class="note-item reveal" style="transition-delay:' + Math.min(i, 8) * 45 + 'ms">' +
          '<time datetime="' + n.date + '">' + n.date + "</time>" +
          "<p>" + H.escapeHtml(n.text) + "</p>" +
          "</div>";
      });
      html += "</div>";
      box.innerHTML = html;
      window.BLOG_initReveal(box);
    }
    __initNotesPage();
  </script>
