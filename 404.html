<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file: 'unsafe-inline'; style-src 'self' file: 'unsafe-inline'; img-src 'self' file: data:; font-src 'self' file:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="msvalidate.01" content="DB0D25943BA8A5B2295DCE027CB3AC0E" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'><rect width='48' height='48' rx='11' fill='%231C1C1E'/><rect x='13' y='18' width='22' height='22' fill='none' stroke='%23FFFFFF' stroke-width='2.6'/><line x1='19' y1='34' x2='41' y2='12' stroke='%236FAE90' stroke-width='2.6' stroke-linecap='round'/><circle cx='19' cy='34' r='2.8' fill='%236FAE90'/></svg>">
  <meta name="robots" content="noindex">
  <title>页面走丢了 · 知野 ZHIYE</title>
  <style>
    :root {
      --bg: #f5f5f7; --surface: #ffffff; --border: #e5e5ea;
      --text: #1d1d1f; --text-secondary: #6e6e73; --muted: #86868b;
      --accent: #5856d6; --accent-soft: rgba(88, 86, 214, 0.12);
    }
    [data-theme="dark"] {
      --bg: #000000; --surface: #1c1c1e; --border: #2a2a2c;
      --text: #f5f5f7; --text-secondary: #a1a1a6; --muted: #8a867e;
      --accent: #9d9dff; --accent-soft: rgba(157, 157, 255, 0.14);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh; display: grid; place-items: center;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased; padding: 24px;
    }
    .card {
      text-align: center; max-width: 460px; width: 100%;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 24px; padding: 56px 40px 44px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
    }
    [data-theme="dark"] .card { box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5); }
    .code {
      font-size: 88px; font-weight: 800; letter-spacing: -0.04em; line-height: 1;
      background: linear-gradient(135deg, var(--accent), #b16cea);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      margin-bottom: 14px; font-variant-numeric: tabular-nums;
    }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 10px; letter-spacing: -0.01em; }
    p { font-size: 15px; color: var(--text-secondary); line-height: 1.7; margin-bottom: 30px; }
    .btn {
      display: inline-block; padding: 13px 34px; border-radius: 999px;
      background: var(--accent); color: #fff; text-decoration: none;
      font-size: 15.5px; font-weight: 600;
      transition: translate 0.25s ease, opacity 0.25s ease;
    }
    .btn:hover { opacity: 0.88; translate: 0 -2px; }
    .hint { margin-top: 22px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  </style>
</head>
<body>
  <main class="card">
    <div class="code">404</div>
    <h1>这个页面走丢了</h1>
    <p>它可能已被移动、删除，或者从未存在过。<br>不如回到首页，那里有最新的文章。</p>
    <a class="btn" href="/">返回首页</a>
    <p class="hint"><span id="countdown">8</span> 秒后自动跳转…</p>
  </main>
  <script>
    (function () {
      try {
        var t = null;
        try { t = localStorage.getItem("blog-theme"); } catch (e) {}
        if (t === "dark" || t === "light") {
          document.documentElement.setAttribute("data-theme", t);
        } else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      } catch (e) {}
      /* 404 页可能被托管在任何缺失路径下（如 /posts/xxx/），相对链接会失效，用站点根绝对路径 */
      var n = 8, el = document.getElementById("countdown");
      if (!el) return;
      var timer = setInterval(function () {
        n--;
        if (n <= 0) {
          clearInterval(timer);
          location.replace("/");
        } else {
          el.textContent = n;
        }
      }, 1000);
    })();
  </script>
</body>
</html>
